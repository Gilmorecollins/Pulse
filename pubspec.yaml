name: pulse
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.4+4

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local persistence (source of truth for v1 — see docs/ARCHITECTURE.md)
  drift: ^2.22.1
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Preferences (onboarding settings — not worth a DB table yet)
  shared_preferences: ^2.3.4

  uuid: ^4.5.1
  intl: ^0.19.0

  # Check-in scheduling (see docs/ARCHITECTURE.md — Android 12+ exact
  # alarms need explicit permission handling, hence timezone-aware
  # scheduling rather than naive Timer/Future.delayed)
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

  # WhatsApp report sharing — opens WhatsApp with the report pre-filled
  # via the wa.me deep link (see docs/API.md); no Business API needed.
  url_launcher: ^6.3.1

  # Google Drive backup/restore — see docs/ARCHITECTURE.md's "Backup"
  # section. google_sign_in handles auth; googleapis is the Drive API v3
  # client; the extension bridges google_sign_in's auth headers into an
  # http.Client googleapis can use.
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Update check — compares the installed version (package_info_plus)
  # against the latest GitHub release (a plain http GET, no auth: the
  # repo/releases are public) and prompts to update if newer. See
  # lib/core/update/.
  http: ^1.2.2
  package_info_plus: ^8.1.2

  # In-app update install — downloads the release APK and hands it to
  # the system installer (Android still requires the user's explicit
  # confirmation; no app can silently self-install). Bundles its own
  # FileProvider, so no AndroidManifest FileProvider/file_paths.xml
  # needed on our side — just the REQUEST_INSTALL_PACKAGES permission.
  open_filex: ^4.7.0

  # Profile photo picking (Settings) — uses Android's system Photo
  # Picker on API 33+ and its own manifest-merged permission on older
  # versions, so no AndroidManifest changes needed on our side.
  image_picker: ^1.1.2

  # Serif display font for the startup loading screen only (see
  # lib/core/widgets/startup_loading_screen.dart) — fetched once at
  # runtime and cached, same tradeoff as this app's other network
  # features (Drive, update check); falls back to the system font
  # rather than failing if offline on first launch.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

# App icon — see docs/PRODUCT.md/README.md; regenerate with
# `dart run flutter_launcher_icons` after changing assets/icon/icon.png.
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

# Native splash — a blank field, no icon, colored to exactly match
# StartupLoadingScreen's background (scheme.surface: mist/#F1F4FA in
# light, navyDeep/#141E30 in dark — see lib/core/theme/pulse_theme.dart)
# so the handoff from native splash to that Flutter screen is invisible:
# no color cut, no icon-then-different-screen moment, just the Playfair
# "Pulse" wordmark fading in on what looks like one continuous screen.
# Android always paints something immediately on cold start — this is
# the closest a native splash (image+color only, no text, no animation)
# can get to "no splash at all". An earlier version showed the app icon
# here instead; dropped once StartupLoadingScreen gave the real branded
# moment a proper (animated, textual) home of its own — see
# lib/core/widgets/startup_loading_screen.dart and docs/ARCHITECTURE.md.
# Regenerate with `dart run flutter_native_splash:create` after
# changing anything below.
flutter_native_splash:
  color: "#F1F4FA"
  color_dark: "#141E30"
  android_12:
    color: "#F1F4FA"
    color_dark: "#141E30"
    # Android 12+'s SplashScreen API always shows *an* icon in a circle;
    # leaving it unset falls back to the launcher icon (the exact "icon
    # screen" moment we're trying to remove). A fully transparent image
    # plus a background matching the field color is the closest thing
    # to "no icon at all" the API allows.
    image: assets/splash/blank.png
    image_dark: assets/splash/blank.png
    icon_background_color: "#F1F4FA"
    icon_background_color_dark: "#141E30"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Onboarding's Welcome step background (see docs/PRODUCT.md — the
  # only screen with a photographic background; everything else in the
  # app uses the Navy Mirage palette directly, no imagery).
  assets:
    - assets/onboarding/welcome_background.jpg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
